<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner Scale Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14213d; --muted:#5b667a;
  --accent:#c81e64; --accent-soft:#fbe4ee; --line:#cdd5df; --field:#f6f8fa;
  --ok:#17794a; --warn:#a15c00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151d; --surface:#182029; --ink:#e8edf5; --muted:#93a0b5;
    --accent:#ff6aa5; --accent-soft:#3a1e2c; --line:#2b3644; --field:#111821;
    --ok:#4cc38a; --warn:#f0b44c;
  }
}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#182029; --ink:#e8edf5; --muted:#93a0b5;
  --accent:#ff6aa5; --accent-soft:#3a1e2c; --line:#2b3644; --field:#111821;
  --ok:#4cc38a; --warn:#f0b44c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.45; padding:20px 14px 48px;
}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:34px;margin:0 0 2px;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;margin-bottom:14px}
.card h2{font-size:17px;font-weight:600;margin:0 0 2px}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label.f{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.pair{display:flex;gap:6px}
input,select{
  font:inherit;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-height:44px;width:100%;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pair input{flex:1 1 auto;min-width:0;font-variant-numeric:tabular-nums}
.pair select{flex:0 0 78px;width:78px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{
  font:inherit;font-size:14px;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:7px;padding:8px 12px;min-height:40px;cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#1a0710}
:root[data-theme="light"] .seg button[aria-pressed="true"]{color:#fff}
.iconbtn{
  font:inherit;font-size:13px;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:7px;padding:8px 12px;min-height:40px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.iconbtn:hover{border-color:var(--accent)}
.rowhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.big{
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;
  padding:14px 16px;margin-bottom:14px;
}
.big .lbl{font-size:14px;color:var(--muted)}
.big .val{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums}
.big .val small{font-size:22px;font-weight:600;color:var(--muted)}
.big .alt{color:var(--muted);font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
.preview{overflow-x:auto}
.preview svg{display:block;max-width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
th{font-weight:500;color:var(--muted);width:46%}
td b{font-weight:600}
tr:last-child th,tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.warn{color:var(--warn)}
.ok{color:var(--ok)}
.err{color:var(--warn);font-size:14px;margin:6px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.theme{font:inherit;font-size:13px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;min-height:36px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Banner Scale Calculator</h1>
      <p class="sub">Enter the actual size, set a limit for the working canvas — the proportional size is calculated instantly.</p>
    </div>
    <button class="theme" id="themeBtn" type="button">Dark / Light</button>
  </div>

  <div class="card">
    <div class="rowhead">
      <h2 id="s1title">1. Actual Size (banner dimensions)</h2>
      <button class="iconbtn" id="swapBtn" type="button" title="Swap Width and Height">&#8646; Swap W/H</button>
    </div>
    <p class="hint" id="s1hint">Enter Width and Height in any unit.</p>
    <div class="row">
      <div>
        <label class="f" for="w0" id="w0lbl">Width (W)</label>
        <div class="pair"><input id="w0" type="text" inputmode="decimal" value="12" autocomplete="off"><select id="w0u" aria-label="Width unit"></select></div>
      </div>
      <div>
        <label class="f" for="h0" id="h0lbl">Height (H)</label>
        <div class="pair"><input id="h0" type="text" inputmode="decimal" value="3" autocomplete="off"><select id="h0u" aria-label="Height unit"></select></div>
      </div>
    </div>
    <div id="err0" class="err" role="alert"></div>
  </div>

  <div class="card">
    <h2 id="s2title">2. Working Size (Illustrator canvas)</h2>
    <label class="f" for="lim" id="limLabel">Limit</label>
    <div class="pair" style="max-width:280px"><input id="lim" type="text" inputmode="decimal" value="500" autocomplete="off"><select id="limu" aria-label="Limit unit"></select></div>
    <div id="err1" class="err" role="alert"></div>
  </div>

  <div class="big" aria-live="polite">
    <div class="lbl" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span id="bigLbl">Working Size (use this as your artboard)</span>
      <span style="display:flex;align-items:center;gap:6px">
        <label class="f" for="outu" style="margin:0;white-space:nowrap">Unit</label>
        <select id="outu" aria-label="Result unit" style="width:auto;min-width:76px"></select>
      </span>
    </div>
    <div class="val" id="bigVal"></div>
    <div class="alt" id="bigAlt"></div>
    <div style="margin-top:10px">
      <button class="iconbtn" id="copyBtn" type="button">&#128203; Copy Result</button>
      <span id="copiedMsg" style="font-size:13px;color:var(--ok);margin-left:8px"></span>
    </div>
  </div>

  <div class="card preview">
    <div id="preview"></div>
  </div>

  <div class="card">
    <h2>Scale</h2>
    <div class="scroll"><table id="tblScale"></table></div>
  </div>


</div>

<script>
(function(){
  var MM = {mm:1, cm:10, m:1000, in:25.4, ft:304.8};
  var UNITS = ['mm','cm','m','in','ft'];
  var UNAME = {mm:'mm', cm:'cm', m:'m', in:'inch', ft:'ft'};
  var state = {};
  var STORE_KEY='banner_calc_v2';

  function $(id){return document.getElementById(id)}

  function fillUnits(sel, def){
    UNITS.forEach(function(u){
      var o=document.createElement('option'); o.value=u; o.textContent=UNAME[u];
      if(u===def) o.selected=true; sel.appendChild(o);
    });
  }
  fillUnits($('w0u'),'ft'); fillUnits($('h0u'),'ft'); fillUnits($('limu'),'mm'); fillUnits($('outu'),'mm');

  $('swapBtn').onclick=function(){
    var w=$('w0').value, h=$('h0').value, wu=$('w0u').value, hu=$('h0u').value;
    $('w0').value=h; $('h0').value=w; $('w0u').value=hu; $('h0u').value=wu;
    save(); calc();
  };

  var outuTouched=false;
  $('outu').addEventListener('change', function(){outuTouched=true; save(); calc();});
  $('limu').addEventListener('change', function(){ if(!outuTouched){ $('outu').value=$('limu').value; } save(); calc(); });

  function num(id){
    var v=parseFloat(String($(id).value).replace(',', '.'));
    return isFinite(v)?v:NaN;
  }
  function fmt(n, d){
    if(!isFinite(n)) return '-';
    d = (d===undefined)?2:d;
    var s=n.toFixed(d);
    if(s.indexOf('.')>-1) s=s.replace(/0+$/,'').replace(/\.$/,'');
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, function(m,off,str){
      return str.indexOf('.')>-1 && off>str.indexOf('.') ? '' : ',';
    });
  }
  function row(k,v){return '<tr><th scope="row">'+k+'</th><td>'+v+'</td></tr>'}

  var lastCopyText='';

  function calc(){
    var W0=num('w0')*MM[$('w0u').value];
    var H0=num('h0')*MM[$('h0u').value];
    var L=num('lim')*MM[$('limu').value];

    $('limLabel').textContent='Width';

    $('err0').textContent = (!(W0>0)||!(H0>0)) ? 'Enter a valid Width and Height in Section 1.' : '';
    $('err1').textContent = !(L>0) ? 'Enter a valid limit.' : '';
    if(!(W0>0)||!(H0>0)||!(L>0)){
      $('bigVal').textContent='-'; $('bigAlt').textContent=''; lastCopyText='';
      $('preview').innerHTML=''; $('tblScale').innerHTML='';
      return;
    }

    var w,h;
    w=L; h=H0*L/W0;

    // W0,H0 = Actual (exact/given). w,h = Working (fit result).
    var nameGiven = 'Actual';
    var nameFit   = 'Working';

    var factor = W0/w; // actual / working
    var enlarge = factor>=1; // true: actual is bigger than working (normal case, scale up in Corel)

    var ou=$('outu').value, oname=UNAME[ou], of=MM[ou];
    $('bigVal').innerHTML='W '+fmt(w/of,3)+' <small>'+oname+'</small> &times; H '+fmt(h/of,3)+' <small>'+oname+'</small>';
    var altParts=[];
    UNITS.forEach(function(u){ if(u!==ou) altParts.push(fmt(w/MM[u],3)+' \u00d7 '+fmt(h/MM[u],3)+' '+UNAME[u]); });
    $('bigAlt').textContent=altParts.join('   |   ');
    lastCopyText = 'W '+fmt(w/of,3)+' '+oname+' x H '+fmt(h/of,3)+' '+oname;

    // preview
    var maxW=560, maxH=150, ar=w/h, pw,ph;
    if(ar>=maxW/maxH){pw=maxW;ph=maxW/ar}else{ph=maxH;pw=maxH*ar}
    var pad=34, vw=pw+pad*2, vh=ph+pad*2;
    var svg='<svg viewBox="0 0 '+vw+' '+vh+'" width="'+vw+'" role="img" aria-label="Result preview">'
      +'<rect x="'+pad+'" y="'+pad+'" width="'+pw+'" height="'+ph+'" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>'
      +'<text x="'+(pad+pw/2)+'" y="'+(pad-12)+'" text-anchor="middle" font-size="14" fill="var(--ink)" font-family="Barlow,Arial,sans-serif">W '+fmt(w/of,2)+' '+oname+'</text>'
      +'<text x="'+(pad-12)+'" y="'+(pad+ph/2)+'" text-anchor="middle" font-size="14" fill="var(--ink)" font-family="Barlow,Arial,sans-serif" transform="rotate(-90 '+(pad-12)+' '+(pad+ph/2)+')">H '+fmt(h/of,2)+' '+oname+'</text>'
      +'<text x="'+(pad+pw/2)+'" y="'+(pad+ph/2+5)+'" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="Barlow,Arial,sans-serif">ratio '+fmt(W0/H0,3)+' : 1</text>'
      +'</svg>';
    $('preview').innerHTML=svg;

    // scale table
    var t='';
    t+=row(nameGiven+' size (given)', fmt(W0/of,2)+' \u00d7 '+fmt(H0/of,2)+' '+oname+'<br><span style="color:var(--muted)">'+fmt(W0/304.8,3)+' \u00d7 '+fmt(H0/304.8,3)+' ft</span>');
    if(enlarge){
      t+=row('Scale up in Corel/print by', '<b>'+fmt(factor*100,2)+' %</b> (to go from '+nameFit+' to '+nameGiven+')');
      t+=row('1 '+oname+' in '+nameFit, '= '+fmt(factor,4)+' '+oname+' in '+nameGiven);
    } else {
      t+=row('Scale down to', '<b>'+fmt((1/factor)*100,2)+' %</b> (to go from '+nameGiven+' to '+nameFit+')');
      t+=row('1 '+oname+' in '+nameGiven, '= '+fmt(1/factor,4)+' '+oname+' in '+nameFit);
    }
    t+=row('Scale factor', '<b>'+fmt(factor,4)+'</b> ('+nameGiven+' \u00f7 '+nameFit+')');
    $('tblScale').innerHTML=t;
  }

  function save(){
    try{
      var data={
        w0:$('w0').value, h0:$('h0').value, w0u:$('w0u').value, h0u:$('h0u').value,
        lim:$('lim').value, limu:$('limu').value, outu:$('outu').value, outuTouched:outuTouched
      };
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    }catch(e){}
  }
  function load(){
    try{
      var raw=localStorage.getItem(STORE_KEY);
      if(!raw) return;
      var d=JSON.parse(raw);
      if(d.w0!==undefined) $('w0').value=d.w0;
      if(d.h0!==undefined) $('h0').value=d.h0;
      if(d.w0u) $('w0u').value=d.w0u;
      if(d.h0u) $('h0u').value=d.h0u;
      if(d.lim!==undefined) $('lim').value=d.lim;
      if(d.limu) $('limu').value=d.limu;
      if(d.outu){ $('outu').value=d.outu; outuTouched=!!d.outuTouched; }
    }catch(e){}
  }

  ['w0','h0','lim'].forEach(function(id){$(id).addEventListener('input',function(){save();calc()})});
  ['w0u','h0u'].forEach(function(id){$(id).addEventListener('change',function(){save();calc()})});

  $('copyBtn').onclick=function(){
    if(!lastCopyText) return;
    function shown(){ $('copiedMsg').textContent='Copied'; setTimeout(function(){$('copiedMsg').textContent=''},1800); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lastCopyText).then(shown, function(){
        $('copiedMsg').textContent='Copy failed';
      });
    } else {
      try{
        var ta=document.createElement('textarea'); ta.value=lastCopyText;
        ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        shown();
      }catch(e){ $('copiedMsg').textContent='Copy failed'; }
    }
  };

  $('themeBtn').onclick=function(){
    var root=document.documentElement, cur=root.getAttribute('data-theme');
    var isDark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', isDark?'light':'dark');
  };

  load();
  calc();
})();
</script>
</body>
</html>
